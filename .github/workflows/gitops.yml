
name: Spark GitOps Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/gitops.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spark-gitops
  cancel-in-progress: false

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "747030889682"
      ECR_REPOSITORY: spark

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"
          docker build -t "${IMAGE_URI}:${IMAGE_TAG}" ./app
          docker push "${IMAGE_URI}:${IMAGE_TAG}"

      - name: Update GitOps branch
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git fetch origin gitops
          git checkout -B gitops origin/gitops

          sed -i -E "s/^  tag: .*/  tag: \"${IMAGE_TAG}\"/" helm/spark/values.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/spark/values.yaml

          if git diff --cached --quiet; then
            echo "Image tag already up to date."
          else
            git commit -m "GitOps: deploy Spark ${IMAGE_TAG}"
            git push origin HEAD:gitops
          fi
